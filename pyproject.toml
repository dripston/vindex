[project]
name = "vindex"
version = "0.3.1"
description = "Evaluation metrics for Indic and code-mixed LLM output."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "dripston" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "indic_transliteration",
]

[project.optional-dependencies]
similarity = [
    "sentence-transformers",
    "transformers",
    "torch",
    "numpy",
]
judge = [
    "groq",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/dripston/vindex"
Repository = "https://github.com/dripston/vindex"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Trap-word dictionary CSVs (Milestone 6.1) must ship inside the
# installed package, not just live in the repo's data/ directory --
# see trap_words.py's PACKAGING note for the real bug this fixes.
vindex = ["data/trap_words/*.csv"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# experiments/ is deliberately exploratory code (see experiments/README.md)
# and is never linted as part of the package; .agents/.claude are unrelated
# tooling directories, not project content; script_check.py at repo root is
# Milestone 1's not-yet-ported engine -- BUILD_PLAN.md 1.1 says port it
# unchanged, don't touch it in Milestone 0; docs/integrations/ deliberately
# matches each third-party tool's own coding idiom (e.g. ragas_vindex.py
# mirrors ragas's own t.Dict/t.Set style from ragas/metrics/_string.py) --
# copy-paste fidelity to the target tool matters more than this repo's own
# lint config there.
extend-exclude = ["experiments", ".agents", ".claude", "script_check.py", "docs/integrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["vindex"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "indic_transliteration.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
