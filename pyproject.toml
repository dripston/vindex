[project]
name = "vindex"
version = "0.6.0"
description = "Evals for Indian-language LLM apps: script adherence, calibrated similarity, an Indic LLM judge and mistranslation checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "dripston" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Hindi",
    "Typing :: Typed",
]
dependencies = [
    "indic_transliteration",
]

[project.optional-dependencies]
similarity = [
    "sentence-transformers",
    "transformers",
    "torch",
    "numpy",
]
judge = [
    "groq",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "build",
    "twine",
    # OpenAIJudge/AnthropicJudge/LiteLLMJudge (judge_model.py) are
    # optional-SDK classes -- an end user installs only the one they
    # use, not all three. dev needs all of them so CI can type-check
    # and test every class, same as groq already is via the `judge`
    # extra.
    "openai",
    "anthropic",
    "litellm",
]

keywords = ["llm", "evaluation", "evals", "hindi", "hinglish", "indic", "code-mixed", "llm-as-a-judge"]

[project.scripts]
vindex = "vindex.cli:main"

[project.urls]
Homepage = "https://dripston.github.io/vindex/"
Documentation = "https://dripston.github.io/vindex/docs.html"
Changelog = "https://github.com/dripston/vindex/blob/master/CHANGELOG.md"
Repository = "https://github.com/dripston/vindex"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Trap-word dictionary CSVs (Milestone 6.1) must ship inside the
# installed package, not just live in the repo's data/ directory --
# see trap_words.py's PACKAGING note for the real bug this fixes.
vindex = ["py.typed", "data/NOTICE.md", "data/trap_words/*.csv", "data/benchmarks/*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# experiments/ is deliberately exploratory code (see experiments/README.md)
# and is never linted as part of the package; .agents/.claude are unrelated
# tooling directories, not project content; script_check.py at repo root is
# Milestone 1's not-yet-ported engine -- BUILD_PLAN.md 1.1 says port it
# unchanged, don't touch it in Milestone 0; examples/integrations/ deliberately
# matches each third-party tool's own coding idiom (e.g. ragas_vindex.py
# mirrors ragas's own t.Dict/t.Set style from ragas/metrics/_string.py) --
# copy-paste fidelity to the target tool matters more than this repo's own
# lint config there.
extend-exclude = ["experiments", ".agents", ".claude", "script_check.py", "examples/integrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
packages = ["vindex"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "indic_transliteration.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# litellm is an optional SDK for LiteLLMJudge (judge_model.py) -- a
# caller installs it themselves only if they use that class, same as
# openai/anthropic for OpenAIJudge/AnthropicJudge (those two ship their
# own type stubs so no override is needed for them). Not part of the
# `judge` extra's own groq dependency.
module = "litellm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
